<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#173d3b">
  <meta name="description" content="蛙蛙厨房：横屏手机浏览器即开即玩的奶蛙厨房小游戏。">
  <title>蛙蛙厨房 · 横屏奶茶小厨房</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-wrap" aria-label="蛙蛙厨房游戏">
    <canvas id="game" aria-label="蛙蛙厨房横屏游戏画面"></canvas>
    <section id="landscape-overlay" aria-labelledby="landscape-title">
      <div class="rotate-device" aria-hidden="true"><span></span><i>⟳</i></div>
      <h1 id="landscape-title">横过手机，开工啦</h1>
      <p>蛙蛙厨房为横屏操控设计<br>转成横屏后，左手移动、右手互动</p>
      <button id="landscape-button" type="button">尝试全屏横屏</button>
      <small>如果没有自动旋转，请手动将手机横过来</small>
    </section>
    <div id="sr-status" class="sr-only" aria-live="polite"></div>
  </main>
  <script src="game.js" defer></script>
</body>
</html>
